<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo Electoral RD 2028</title>
    <!-- Tailwind CSS para diseño moderno -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-800">Monitoreo Electoral RD 2028</h1>
            <p class="text-gray-600 mt-2">Panel en tiempo real con análisis de noticias potenciado por IA</p>
        </header>

        <!-- Contenedor dinámico de candidatos -->
        <div id="candidates-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="text-center col-span-full text-gray-500 py-10">Cargando datos de candidatos...</div>
        </div>
    </div>

    <!-- Script de Firebase y lógica del Frontend -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

        // Tu configuración oficial de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCbtn2RRSKs_dsv8ETHrG6bDSRtokdtXQ4",
            authDomain: "elecciones-2028.firebaseapp.com",
            projectId: "elecciones-2028",
            storageBucket: "elecciones-2028.firebasestorage.app",
            messagingSenderId: "1011171990808",
            appId: "1:1011171990808:web:d5c95849216b542385126d",
            measurementId: "G-HP70TVST5D"
        };

        // Inicializar Firebase y Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadCandidates() {
            const container = document.getElementById('candidates-container');
            try {
                const querySnapshot = await getDocs(collection(db, "candidates"));
                container.innerHTML = ''; 

                if (querySnapshot.empty) {
                    container.innerHTML = `<p class="text-center text-gray-500 col-span-full">No hay candidatos registrados en la base de datos.</p>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const candidateId = docSnap.id;

                    // Color dinámico según impacto
                    let impactColor = "bg-gray-200 text-gray-800";
                    if (data.lastImpact === "Alto") impactColor = "bg-red-100 text-red-800";
                    else if (data.lastImpact === "Medio") impactColor = "bg-yellow-100 text-yellow-800";
                    else if (data.lastImpact === "Bajo") impactColor = "bg-green-100 text-green-800";

                    // Crear tarjeta para el candidato
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-lg shadow-md p-6 flex flex-col justify-between";
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-2xl font-bold text-gray-800 capitalize">${data.candidate || candidateId}</h2>
                                <span class="px-3 py-1 rounded-full text-xs font-semibold ${impactColor}">
                                    Impacto: ${data.lastImpact || 'N/A'}
                                </span>
                            </div>
                            
                            <div class="mb-4">
                                <p class="text-sm font-semibold text-gray-500">Último Resumen:</p>
                                <p class="text-gray-700 mt-1 italic">"${data.lastNewsSummary || 'Sin noticias recientes analizadas.'}"</p>
                            </div>
                        </div>

                        <div class="border-t pt-4 mt-4 text-xs text-gray-500 flex justify-between">
                            <span>Sentimiento AI: <strong>${data.lastSentimentScore ?? 'N/A'}</strong></span>
                            <span>Actualizado: ${data.updatedAt ? new Date(data.updatedAt).toLocaleTimeString() : 'N/A'}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Error al cargar desde Firestore:", error);
                container.innerHTML = `<p class="text-center text-red-500 col-span-full">Error al cargar los datos. Revisa las reglas de seguridad de Firestore.</p>`;
            }
        }

        loadCandidates();
    </script>
</body>
</html>
